<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Selecionar Elementos #03</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        form {
            display: flex;
            flex-direction: column;
        }

        form input,
        form select,
        form button {
            margin: 10px;
            font-size: 1.6em;
        }
    </style>
</head>

<body class="conteudo exercicio">
    <h1>Formulário</h1>
    <form name="pesquisa" action="http://www.google.com.br/search">
        <input type="text" name="q" placeholder="Digite o termo...">
        <select name="hl">
            <option value="pt-br">Português (Brasil)</option>
            <option value="en-us">Inglês (Americano)</option>
        </select>
        <button>Pesquisar</button>
    </form>
    <script>
        // Exibe todos os formulários presentes na página como uma coleção HTML
        console.log(document.forms)

        // Exibe o primeiro formulário da página (índice 0 da coleção)
        console.log(document.forms[0])

        // Retorna todos os elementos com o atributo name="pesquisa"
        console.log(document.getElementsByName('pesquisa'))

        // Acessa diretamente o formulário com name="pesquisa" como uma propriedade do objeto document
        console.log(document.pesquisa)

        // Acessa o campo com name="q" dentro do formulário com name="pesquisa"
        console.log(document.pesquisa.q)

        // Define o valor do campo "q" como "Linux Brasil"
        document.pesquisa.q.value = 'Linux Brasil'

        // Define o valor do campo "hl" como "en-us"
        document.pesquisa.hl.value = 'en-us'

        // Exibe o índice da opção selecionada no campo "hl" (útil em selects)
        console.log(document.pesquisa.hl.selectedIndex)
    </script>

</body>

</html>
